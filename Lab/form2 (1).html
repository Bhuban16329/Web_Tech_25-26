<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <link rel="stylesheet" href="form2.css">
</head>

<body>
  <form class="card" action="form2_process.php" method="post">
    <header class="card-header">
      <h1>Registration</h1>
      <p>Please complete all fields below.</p>
    </header>

    <div class="field">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Jane Doe">
    </div>

    <div class="field">
      <label for="postal">Postal Code</label>
      <input type="text" id="postal" name="postal" placeholder="10001">
    </div>

    <div class="field">
      <label for="dob">Date of Birth</label>
      <input type="text" id="dob" name="dob" placeholder="YYYY-MM-DD">
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="text" id="email" name="email" placeholder="jane@example.com">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="text" id="password" name="password" placeholder="Enter password">
    </div>

    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="" selected>Select a country...</option>
        <option value="United States">United States</option>
        <option value="United Kingdom">United Kingdom</option>
        <option value="Canada">Canada</option>
        <option value="Australia">Australia</option>
        <option value="Bangladesh">Bangladesh</option>
      </select>
    </div>

    <div class="buttons">
      <button type="submit" class="btn-primary">Submit</button>
      <button type="reset" class="btn-secondary">Reset</button>
    </div>
  </form>
</body>

</html>
